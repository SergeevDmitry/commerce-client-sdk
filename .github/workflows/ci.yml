name: SDK checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        include:
          - node: '20'
            python: '3.10'
          - node: '22'
            python: '3.13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --prefix packages/typescript
      - run: npm run build --prefix packages/typescript
      - run: npm test --prefix packages/typescript
      - run: python -m pip install -e 'packages/python[signing]' -r tests/requirements.txt
      - run: python -m unittest discover -s packages/python/tests -v
      - run: python tests/test_signatures.py
      - run: cd packages/typescript && npm pack
      - run: python -m build packages/python
      - run: python -m twine check packages/python/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: packages-node${{ matrix.node }}-python${{ matrix.python }}
          path: |
            packages/typescript/*.tgz
            packages/python/dist/*
