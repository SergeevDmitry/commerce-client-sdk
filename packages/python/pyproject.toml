[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentic-commerce-ucp-client"
version = "0.1.0"
description = "UCP REST client with discovery, capability selection, signing and repeatable cart and checkout requests"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ucp", "universal-commerce-protocol", "agentic-commerce", "ai-agents", "checkout", "sdk"]
dependencies = ["httpx>=0.27,<1"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed", "Topic :: Internet :: WWW/HTTP"]

[project.optional-dependencies]
signing = ["cryptography>=44"]

[project.urls]
Homepage = "https://www.agentic-commerce.sh/protokolle/ucp/"
Documentation = "https://github.com/agentic-commerce-lab/commerce-client-sdk/tree/main/docs"
Repository = "https://github.com/agentic-commerce-lab/commerce-client-sdk"
Issues = "https://github.com/agentic-commerce-lab/commerce-client-sdk/issues"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/agentic_commerce_ucp"]
